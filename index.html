<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07140d"><link rel="manifest" href="manifest.json"><title>DIANO RACER — 3D Jungle</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#030705;font-family:system-ui,sans-serif;color:#fff;touch-action:none}
canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0 0 auto;padding:12px;z-index:5;pointer-events:none;text-shadow:2px 2px #000;font-weight:900}.top{display:flex;justify-content:space-between;font-size:18px}.powers{display:flex;justify-content:center;gap:6px;margin-top:7px}.pill{background:#06140dd9;border:1px solid #54735a;border-radius:20px;padding:5px 9px}.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(#0002,#000b);padding:20px}.hide{display:none}.logo{font-size:clamp(52px,15vw,100px);font-weight:1000;line-height:.8;letter-spacing:-5px;text-shadow:5px 6px #39200b}.logo span{display:block;color:#42d23d;text-shadow:4px 5px #0b4211}.tag{font-weight:900;letter-spacing:3px}.btn{width:min(340px,85vw);padding:15px;margin:6px;border:1px solid #a47b48;border-radius:12px;color:#fff;font-size:20px;font-weight:1000;background:linear-gradient(#5c452f,#2d2117);box-shadow:0 4px #120c08}.primary{background:linear-gradient(#65e847,#15941e);box-shadow:0 5px #07550d}.hint{max-width:420px;line-height:1.6;background:#06140ddd;border:1px solid #49644f;border-radius:14px;padding:18px}
</style></head><body>
<canvas id="game"></canvas>
<div id="hud" class="hud hide"><div class="top"><span>🪙 <b id="score">0</b></span><span>↗ <b id="dist">0</b>m</span><span>❤️ <b id="life">2</b></span></div><div class="powers"><span class="pill">🧲 <b id="mag">0</b></span><span class="pill">⚡ <b id="boost">0</b></span><span class="pill">🛡 <b id="shield">0</b></span></div></div>
<section id="menu" class="screen"><div class="logo">DIANO<span>RACER</span></div><p class="tag">3D JUNGLE RUNNER</p><button id="play" class="btn primary">PLAY</button><button id="how" class="btn">HOW TO PLAY</button></section>
<section id="howScreen" class="screen hide"><h1>HOW TO PLAY</h1><div class="hint">Swipe left/right to change lane.<br>Swipe up to jump.<br>Swipe down to slide.<br><br>Collect coins and power-ups. Avoid logs, rocks, spikes and jungle gates.</div><button id="back" class="btn">BACK</button></section>
<section id="over" class="screen hide"><h1>GAME OVER</h1><div class="hint">SCORE <b id="final">0</b><br>BEST <b id="best">0</b></div><button id="retry" class="btn primary">RETRY</button><button id="home" class="btn">HOME</button></section>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module" src="game.js"></script></body></html>
